# This proxy is reachable only on the run-scoped internal Docker network.
# Keep the runtime allowlist intentionally small so benchmark tasks cannot
# browse the public web through code-execution or other environment tools.

http_port 3128
visible_hostname archipelago-runtime-proxy

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager

acl allowed_runtime dstdomain \
    api.openai.com \
    chatgpt.com \
    generativelanguage.googleapis.com \
    oauth2.googleapis.com \
    .aiplatform.googleapis.com

http_access allow allowed_runtime
http_access deny all

cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
